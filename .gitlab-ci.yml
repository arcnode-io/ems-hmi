stages:
  - check
  - publish
  - mirror

check-web:
  stage: check
  script:
    - npm ci --legacy-peer-deps
    - npx playwright install --with-deps chromium
    - npm run checks -w packages/web
    - npm run cover -w packages/web
  coverage: '/All files\s*\|\s*[\d.]+/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: packages/web/coverage/cobertura-coverage.xml

check-mobile:
  stage: check
  script:
    - npm ci --legacy-peer-deps
    - npm run checks -w packages/mobile

build-web:
  stage: publish
  script:
    - docker login -u admin -p $HARBOR_PASSWORD 173.211.12.43:8083
    - docker build -t 173.211.12.43:8083/library/ems-hmi-web packages/web
    - docker push 173.211.12.43:8083/library/ems-hmi-web

mirror:
  stage: mirror
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  script:
    - git checkout -B main
    - git push --mirror git@github.com:arcnode-io/ems-hmi.git
  only:
    - main
