stages:
  - check
  - publish
  - mirror

check-web:
  stage: check
  script:
    - npm ci --legacy-peer-deps
    - npx playwright install --with-deps chromium
    - npm run checks -w packages/web
    - npm run cover -w packages/web
  coverage: '/All files\s*\|\s*[\d.]+\s*\|\s*[\d.]+\s*\|\s*[\d.]+\s*\|\s*(\d+(?:\.\d+)?)/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: packages/web/coverage/cobertura-coverage.xml

check-mobile:
  stage: check
  script:
    - npm ci --legacy-peer-deps
    - npm run checks -w packages/mobile

build-web:
  stage: publish
  # The ONE docker image for every real-backend stack (cloud, ISO, the
  # device-demo launcher). Built `deployed`: no site baked in — each deployer
  # mounts /opt/arcnode/hmi-cfg.customer.yml and the HMI fails closed without it.
  script:
    - npm ci --legacy-peer-deps
    - VITE_ENV=deployed npm run build -w packages/web
    - aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws
    - docker build -t public.ecr.aws/y1d2j6a8/ems-hmi packages/web
    - docker push public.ecr.aws/y1d2j6a8/ems-hmi
  # Reason: shared shell runner — a login left behind expires after 12 h and then
  # breaks every job's anonymous pulls (check-web's integration stack pulls from
  # public ECR). after_script runs even when the push fails.
  after_script:
    - docker logout public.ecr.aws
  dependencies: []

publish-apk:
  stage: publish
  # The customer APK (ENV=deployed: operator enters the site address).
  # platform-api's delivery email links this fixed key. Release signing reads
  # ANDROID_RELEASE_* from the runner env (see packages/mobile/template-secrets.env);
  # gradle fails rather than sign with the debug key.
  script:
    - npm ci --legacy-peer-deps
    # Reason: one command per line — a failing `a && b` list doesn't stop the
    # job, so the upload ran after a failed build.
    - (cd packages/mobile/android; ENV=deployed ./gradlew assembleRelease --no-daemon)
    - aws s3 cp packages/mobile/android/app/build/outputs/apk/release/app-release.apk s3://arcnode-public/ems-hmi/latest.apk --content-type application/vnd.android.package-archive
  dependencies: []
  only:
    - main

mirror:
  stage: mirror
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  script:
    - git checkout -B main
    - git push --mirror git@github.com:arcnode-io/ems-hmi.git
  only:
    - main
