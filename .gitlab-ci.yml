stages:
  - check
  - publish
  - mirror

check-web:
  stage: check
  script:
    - npm ci --legacy-peer-deps
    - npx playwright install --with-deps chromium
    - npm run checks -w packages/web
    - npm run cover -w packages/web
    - npm run build -w packages/web
  coverage: '/All files\s*\|\s*[\d.]+\s*\|\s*[\d.]+\s*\|\s*[\d.]+\s*\|\s*(\d+(?:\.\d+)?)/'
  artifacts:
    when: always
    paths:
      - packages/web/dist/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: packages/web/coverage/cobertura-coverage.xml

check-mobile:
  stage: check
  script:
    - npm ci --legacy-peer-deps
    - npm run checks -w packages/mobile

build-web:
  stage: publish
  script:
    - aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws
    - docker build -t public.ecr.aws/y1d2j6a8/ems-hmi packages/web
    - docker push public.ecr.aws/y1d2j6a8/ems-hmi
  dependencies:
    - check-web

mirror:
  stage: mirror
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  script:
    - git checkout -B main
    - git push --mirror git@github.com:arcnode-io/ems-hmi.git
  only:
    - main
