<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=1480"/>
<title>ARCNODE EMS — Overview · Desktop</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600&family=Space+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background:
      linear-gradient(180deg, #050505 0%, #0a0a0a 50%, #d8d0bf 50%, #c8bea8 100%);
    font-family: system-ui, -apple-system, sans-serif;
    color: #fff;
  }
  .stage {
    min-height: 100vh;
    padding: 32px 24px 64px;
    box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center;
    gap: 36px;
  }
  .row { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .row-label {
    font-family: 'DM Mono', monospace;
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.2em; text-transform: uppercase;
  }
  .row-label.sov  { color: #b0a89c; }
  .row-label.solr { color: #5a5248; }
  .row-meta {
    font-family: 'DM Mono', monospace;
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    margin-top: -8px;
  }
  .row-meta.sov  { color: #6b6860; }
  .row-meta.solr { color: #8a8278; }

  .frame-shell {
    width: 1440px; height: 900px;
    border-radius: 12px; overflow: hidden;
    box-shadow:
      0 30px 80px rgba(0,0,0,0.45),
      0 6px 18px rgba(0,0,0,0.3),
      inset 0 0 0 1px rgba(255,255,255,0.04);
  }
  .frame-shell.solr {
    box-shadow:
      0 30px 80px rgba(40,30,18,0.18),
      0 6px 18px rgba(40,30,18,0.10),
      inset 0 0 0 1px rgba(255,255,255,0.5);
  }

  @keyframes ackPulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.55; transform: scale(0.85); }
  }
  @keyframes inspectorIn {
    from { transform: translateX(20px); opacity: 0; }
    to   { transform: translateX(0); opacity: 1; }
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(128,128,128,0.25); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="marketing-mode.js"></script>
</head>
<body>
<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#0a3d2e"/>
        <stop offset="1" stop-color="#27a699"/>
      </linearGradient>
    </defs>
    <rect width="100" height="100" fill="url(#g)"/>
    <g transform="translate(30 35) scale(1)" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="40" height="28" rx="2"/>
      <path d="M0 6h40"/>
      <path d="M8 12v12M14 14v10M20 11v13M26 16v8M32 13v11"/>
    </g>
  </svg>
</template>

<div id="root"></div>

<script type="text/babel" src="tokens.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="desktop-chrome.jsx"></script>
<script type="text/babel" src="overview-desktop.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>

<script type="text/babel">
  const { useState, useEffect } = React;

  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "density": "dense",
    "sidebarCollapsed": false
  }/*EDITMODE-END*/;

  function DesktopFrame({ theme, label, sub }) {
    const [route, setRoute] = useState('/');
    const [selectedGpu, setSelectedGpu] = useState(null);
    const [tweaks] = (typeof useTweaks === 'function')
      ? useTweaks(TWEAK_DEFAULTS)
      : [TWEAK_DEFAULTS, () => {}];
    const t = theme;
    const themeName = t.name === 'sovereign' ? 'sov' : 'solr';

    return (
      <div className="row" data-screen-label={`Overview · ${t.name === 'sovereign' ? 'Sovereign' : 'Solarpunk'} · Desktop`}>
        <div className={`row-label ${themeName}`}>{label}</div>
        <div className={`frame-shell ${themeName}`}>
          <div style={{
            width: '100%', height: '100%',
            display: 'flex', flexDirection: 'column',
            background: t.bg,
            fontFamily: t.fontBody, color: t.text,
          }}>
            <BrowserTabStrip t={t} route={route}/>
            <div style={{ flex: 1, display: 'flex', minHeight: 0, position: 'relative' }}>
              <Sidebar t={t}
                       route={route}
                       collapsed={tweaks.sidebarCollapsed}
                       density={tweaks.density}
                       onNavigate={(r) => { setRoute(r); setSelectedGpu(null); }}/>
              <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0, position: 'relative' }}>
                <DesktopTopBar t={t} route={route} density={tweaks.density}/>
                <DesktopStatusStrip t={t}/>
                <OverviewDesktopBody
                  t={t}
                  density={tweaks.density}
                  selectedGpu={selectedGpu}
                  onSelectGpu={setSelectedGpu}/>
                {selectedGpu && (
                  <InspectorPanel t={t} gpu={selectedGpu} onClose={() => setSelectedGpu(null)}/>
                )}
              </div>
            </div>
          </div>
        </div>
        <div className={`row-meta ${themeName}`}>{sub}</div>
      </div>
    );
  }

  function App() {
    return (
      <div className="stage">
        <DesktopFrame theme={SOVEREIGN}  label="Sovereign · Dark"   sub="1440 × 900 · desktop · click any GPU cell to inspect"/>
        <DesktopFrame theme={SOLARPUNK}  label="Solarpunk · Light"  sub="1440 × 900 · desktop · click sidebar to switch routes"/>
        {typeof TweaksPanel === 'function' && (
          <TweaksPanel defaults={TWEAK_DEFAULTS} title="Tweaks">
            {(tweaks, setTweak) => (
              <>
                <TweakSection title="Layout">
                  <TweakRadio label="Density"
                    value={tweaks.density}
                    onChange={(v) => setTweak('density', v)}
                    options={[
                      { value: 'comfortable', label: 'Comfortable' },
                      { value: 'dense',       label: 'Dense' },
                    ]}/>
                  <TweakToggle label="Sidebar collapsed (icon rail)"
                    value={tweaks.sidebarCollapsed}
                    onChange={(v) => setTweak('sidebarCollapsed', v)}/>
                </TweakSection>
              </>
            )}
          </TweaksPanel>
        )}
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
