local:
  logLevel: "DEBUG"
  e2e: false
  deploymentName: "Localhost Dev"
  deploymentHost: "localhost"
  siteId: "local_site"
  mqttUri: "ws://localhost:8083/mqtt"
  deviceApiUri: "http://localhost:3000"
  chatApiUri: "http://localhost:8000"

beta:
  logLevel: "INFO"
  e2e: true
  deploymentName: "Beta Sandbox"
  deploymentHost: "beta.arcnode.io"
  siteId: "beta_site"
  mqttUri: "wss://beta-broker.example.com:8083/mqtt"
  deviceApiUri: "https://beta-device-api.example.com"
  chatApiUri: "https://analyst-api.example.com"

# Web-demo counterpart: mock devices + fixture topology, hosted analyst.
ai-demo:
  logLevel: "INFO"
  e2e: false
  deploymentName: "Brookside DC-1"
  deploymentHost: "arcnode.customer-site.internal"
  siteId: "demo-site"
  mqttUri: ""
  deviceApiUri: ""
  chatApiUri: "https://sandbox-analyst.arcnode.io"

# End-to-end device demo against the local compose stack, through its nginx
# (same paths as web). Absolute URLs so Settings' host override can repoint
# them at the compose machine; empty mqttUri → ws://<host>/mqtt.
device-demo:
  logLevel: "INFO"
  e2e: true
  deploymentName: "Brookside DC-1"
  deploymentHost: "localhost"
  siteId: "demo_site"
  mqttUri: ""
  deviceApiUri: "http://localhost/api"
  chatApiUri: "http://localhost"
