<?xml version="1.0" encoding="UTF-8"?>
<!-- Portrait variant for phone widths. Particles tagged
     `data-flip="envelope"` reverse on EXP per SldCanvas overlay. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 720">

  <!-- ── Utility-side feeds (top) ─────────────────────────────────────── -->
  <g id="operating_envelope_01" data-comp="device-node" data-template="operating_envelope" transform="translate(95 50)">
    <rect data-region="body" x="-65" y="-22" width="130" height="44" rx="3" fill="currentColor" />
    <circle data-region="status-indicator" cx="58" cy="-14" r="3" />
    <text data-region="label-name" x="0" y="-2" text-anchor="middle" fill="currentColor">DOE Feed</text>
    <text data-region="label-template" x="0" y="12" text-anchor="middle" fill="currentColor">operating_envelope</text>
    <rect data-region="hit-area" x="-65" y="-22" width="130" height="44" fill="transparent" />
  </g>

  <g id="line_rating_01" data-comp="device-node" data-template="line_rating" data-role="dlr-badge" transform="translate(285 50)">
    <rect data-region="body" x="-55" y="-22" width="110" height="44" rx="3" fill="currentColor" />
    <circle data-region="status-indicator" cx="48" cy="-14" r="3" />
    <text data-region="label-name" x="0" y="-2" text-anchor="middle" fill="currentColor">DLR Feed</text>
    <text data-region="label-template" x="0" y="12" text-anchor="middle" fill="currentColor">line_rating</text>
    <rect data-region="hit-area" x="-55" y="-22" width="110" height="44" fill="transparent" />
  </g>

  <!-- ── POI revenue meter ────────────────────────────────────────────── -->
  <g id="revenue_meter_01" data-comp="device-node" data-template="revenue_meter" data-role="poi" transform="translate(190 160)">
    <rect data-region="body" x="-72" y="-26" width="144" height="52" rx="4" fill="currentColor" />
    <circle data-region="status-indicator" cx="64" cy="-18" r="3" />
    <text data-region="primary-value" x="0" y="-2" text-anchor="middle" fill="currentColor"></text>
    <text data-region="label-name" x="0" y="0" text-anchor="middle" fill="currentColor">GRD-RM-001</text>
    <text data-region="label-template" x="0" y="14" text-anchor="middle" fill="currentColor">revenue_meter</text>
    <text data-region="state-label" x="-22" y="16" text-anchor="middle" fill="currentColor">DOE</text>
    <text data-region="state-token" x="22" y="16" text-anchor="middle" fill="currentColor"></text>
    <rect data-region="hit-area" x="-72" y="-26" width="144" height="52" fill="transparent" />
  </g>

  <!-- Dotted info lines from feeds to POI (no particles) -->
  <path d="M 95 72 L 95 130 L 150 130 L 150 140" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="2 3" opacity="0.5" />
  <path d="M 285 72 L 285 130 L 230 130 L 230 140" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="2 3" opacity="0.5" />

  <!-- POI → main breaker → AC bus (conductor split around breaker glyph) -->
  <path d="M 190 186 L 190 225" fill="none" stroke="currentColor" stroke-width="2" />
  <circle data-region="particle" data-flip="envelope" r="2" fill="currentColor" opacity="0.75">
    <animateMotion dur="3s" repeatCount="indefinite" path="M 190 186 L 190 225" />
  </circle>
  <g data-comp="breaker" transform="translate(190 232)">
    <circle data-region="ring" cx="0" cy="0" r="7" fill="none" stroke="currentColor" stroke-width="1.5" />
    <line data-region="ring-bar" x1="-4" y1="0" x2="4" y2="0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
  </g>
  <path d="M 190 239 L 190 280" fill="none" stroke="currentColor" stroke-width="2" />
  <circle data-region="particle" data-flip="envelope" r="2" fill="currentColor" opacity="0.75">
    <animateMotion dur="3s" begin="-1.5s" repeatCount="indefinite" path="M 190 239 L 190 280" />
  </circle>

  <!-- ── AC bus ───────────────────────────────────────────────────────── -->
  <path id="bus_ac_bus_1" data-comp="bus" data-bus-type="ac" d="M 50 280 L 330 280" fill="none" stroke="currentColor" />
  <!-- Left half: POI tap → Grid Module. Flips on EXP. -->
  <circle data-region="particle" data-flip="envelope" r="2.5" fill="currentColor" opacity="0.75">
    <animateMotion dur="3.5s" repeatCount="indefinite" begin="0s" path="M 190 280 L 50 280" />
  </circle>
  <circle data-region="particle" data-flip="envelope" r="2.5" fill="currentColor" opacity="0.75">
    <animateMotion dur="3.5s" repeatCount="indefinite" begin="-1.75s" path="M 190 280 L 50 280" />
  </circle>
  <!-- Right half: POI tap → ARC-COMPUTE-01 (load, always sinks). -->
  <circle data-region="particle" r="2.5" fill="currentColor" opacity="0.75">
    <animateMotion dur="3.5s" repeatCount="indefinite" begin="0s" path="M 190 280 L 330 280" />
  </circle>
  <circle data-region="particle" r="2.5" fill="currentColor" opacity="0.75">
    <animateMotion dur="3.5s" repeatCount="indefinite" begin="-1.75s" path="M 190 280 L 330 280" />
  </circle>

  <!-- AC drops -->
  <path d="M 95 280 L 95 320" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.7" />
  <circle data-region="particle" data-flip="envelope" r="2" fill="currentColor" opacity="0.75">
    <animateMotion dur="2s" repeatCount="indefinite" path="M 95 280 L 95 320" />
  </circle>
  <path d="M 285 280 L 285 320" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.7" />
  <!-- Compute drop: always downward (load). -->
  <circle data-region="particle" r="2" fill="currentColor" opacity="0.75">
    <animateMotion dur="2s" repeatCount="indefinite" path="M 285 280 L 285 320" />
  </circle>

  <!-- ── AC modules ───────────────────────────────────────────────────── -->
  <g id="grid_module_01" data-comp="device-node" data-template="grid_module" transform="translate(95 345)">
    <rect data-region="body" x="-60" y="-22" width="120" height="44" rx="3" fill="currentColor" />
    <circle data-region="status-indicator" cx="53" cy="-14" r="3" />
    <text data-region="label-name" x="0" y="-2" text-anchor="middle" fill="currentColor">Grid Module</text>
    <text data-region="label-template" x="0" y="12" text-anchor="middle" fill="currentColor">grid_module</text>
    <rect data-region="hit-area" x="-60" y="-22" width="120" height="44" fill="transparent" />
  </g>

  <g id="compute_module_01" data-comp="device-node" data-template="compute_module" transform="translate(285 345)">
    <rect data-region="body" x="-75" y="-22" width="150" height="44" rx="3" fill="currentColor" />
    <circle data-region="status-indicator" cx="67" cy="-14" r="3" />
    <text data-region="label-name" x="0" y="-2" text-anchor="middle" fill="currentColor">ARC-COMPUTE-01</text>
    <text data-region="label-template" x="0" y="12" text-anchor="middle" fill="currentColor">compute_module</text>
    <rect data-region="hit-area" x="-75" y="-22" width="150" height="44" fill="transparent" />
  </g>

  <!-- Compute → CDU (child, dashed; no flow particle) -->
  <path d="M 285 370 L 285 410" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="2 2" opacity="0.5" />
  <g id="cdu_01" data-comp="device-node" data-template="cdu" transform="translate(285 432)">
    <rect data-region="body" x="-48" y="-18" width="96" height="36" rx="3" fill="currentColor" />
    <circle data-region="status-indicator" cx="42" cy="-12" r="3" />
    <text data-region="label-name" x="0" y="-2" text-anchor="middle" fill="currentColor">CDU-01</text>
    <text data-region="label-template" x="0" y="10" text-anchor="middle" fill="currentColor">cdu</text>
    <rect data-region="hit-area" x="-48" y="-18" width="96" height="36" fill="transparent" />
  </g>

  <!-- Grid Module → inverter → DC bus (split around glyph) -->
  <path d="M 95 367 L 95 451" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.7" />
  <circle data-region="particle" data-flip="envelope" r="2" fill="currentColor" opacity="0.75">
    <animateMotion dur="4s" repeatCount="indefinite" path="M 95 367 L 95 451" />
  </circle>
  <g data-comp="inverter" transform="translate(95 460)">
    <circle data-region="ring" cx="0" cy="0" r="9" fill="none" stroke="currentColor" stroke-width="1.2" />
    <text data-region="glyph" x="0" y="3" text-anchor="middle" fill="currentColor" font-size="11" font-weight="700">~</text>
  </g>
  <path d="M 95 469 L 95 540" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.7" />
  <circle data-region="particle" data-flip="envelope" r="2" fill="currentColor" opacity="0.75">
    <animateMotion dur="3s" repeatCount="indefinite" path="M 95 469 L 95 540" />
  </circle>

  <!-- ── DC bus ───────────────────────────────────────────────────────── -->
  <path id="bus_dc_bus_1" data-comp="bus" data-bus-type="dc" d="M 95 540 L 330 540" fill="none" stroke="currentColor" />
  <circle data-region="particle" data-flip="envelope" r="2.5" fill="currentColor" opacity="0.75">
    <animateMotion dur="7s" repeatCount="indefinite" begin="0s" path="M 95 540 L 330 540" />
  </circle>
  <circle data-region="particle" data-flip="envelope" r="2.5" fill="currentColor" opacity="0.75">
    <animateMotion dur="7s" repeatCount="indefinite" begin="-2.33s" path="M 95 540 L 330 540" />
  </circle>
  <circle data-region="particle" data-flip="envelope" r="2.5" fill="currentColor" opacity="0.75">
    <animateMotion dur="7s" repeatCount="indefinite" begin="-4.66s" path="M 95 540 L 330 540" />
  </circle>

  <!-- DC drops -->
  <path d="M 140 540 L 140 580" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.7" />
  <circle data-region="particle" data-flip="envelope" r="2" fill="currentColor" opacity="0.75">
    <animateMotion dur="1.5s" repeatCount="indefinite" path="M 140 540 L 140 580" />
  </circle>
  <path d="M 285 540 L 285 580" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.7" />
  <circle data-region="particle" data-flip="envelope" r="2" fill="currentColor" opacity="0.75">
    <animateMotion dur="1.5s" repeatCount="indefinite" path="M 285 540 L 285 580" />
  </circle>

  <!-- ── DC modules (BESS) ────────────────────────────────────────────── -->
  <g id="bess_module_01" data-comp="device-node" data-template="bess_module" transform="translate(140 605)">
    <rect data-region="body" x="-55" y="-22" width="110" height="44" rx="3" fill="currentColor" />
    <circle data-region="status-indicator" cx="48" cy="-14" r="3" />
    <text data-region="label-name" x="0" y="-2" text-anchor="middle" fill="currentColor">BESS-01</text>
    <text data-region="label-template" x="0" y="12" text-anchor="middle" fill="currentColor">bess_module</text>
    <rect data-region="hit-area" x="-55" y="-22" width="110" height="44" fill="transparent" />
  </g>

  <g id="bess_module_02" data-comp="device-node" data-template="bess_module" transform="translate(285 605)">
    <rect data-region="body" x="-55" y="-22" width="110" height="44" rx="3" fill="currentColor" />
    <circle data-region="status-indicator" cx="48" cy="-14" r="3" />
    <text data-region="label-name" x="0" y="-2" text-anchor="middle" fill="currentColor">BESS-02</text>
    <text data-region="label-template" x="0" y="12" text-anchor="middle" fill="currentColor">bess_module</text>
    <rect data-region="hit-area" x="-55" y="-22" width="110" height="44" fill="transparent" />
  </g>

</svg>
