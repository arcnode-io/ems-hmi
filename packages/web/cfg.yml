local:
  logLevel: DEBUG
  e2e: false
  deploymentName: "Localhost Dev"
  deploymentHost: "localhost"
  siteId: "local_site"
  mqttUri: "ws://localhost:8083/mqtt"
  deviceApiUri: "/api"
  chatApiUri: "http://localhost:8000"

beta:
  logLevel: INFO
  e2e: true
  deploymentName: "Beta Sandbox"
  deploymentHost: "beta.arcnode.io"
  siteId: "beta_site"
  mqttUri: "wss://beta-broker.example.com:8083/mqtt"
  deviceApiUri: "https://beta-device-api.example.com"
  chatApiUri: "https://analyst-api.example.com"

# Public S3 web demo: mock devices + fixture topology, hosted analyst.
ai-demo:
  logLevel: INFO
  e2e: false
  deploymentName: "Brookside DC-1"
  deploymentHost: "arcnode.customer-site.internal"
  siteId: "demo-site"
  mqttUri: ""
  deviceApiUri: "/api"
  chatApiUri: "https://analyst.arcnode.io"

# End-to-end device demo against the local compose stack. Same-origin URIs
# mirror the overlay platform-api writes: /api → nginx → device-api, empty
# chatApiUri → /analyst/chat, empty mqttUri → ws(s)://<host>/mqtt.
device-demo:
  logLevel: INFO
  e2e: true
  deploymentName: "Brookside DC-1"
  deploymentHost: "localhost"
  siteId: "device_demo_site"
  mqttUri: ""
  deviceApiUri: "/api"
  chatApiUri: ""
  # Public demo login — the device-demo stack sets AUTH_OPERATOR_PW to this.
  # A sim, not hardware; never set this on a real deployment.
  loginPrefill:
    username: "operator"
    password: "demo-operator-pw"
