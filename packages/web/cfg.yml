# The one baked profile: the dev server, against a local stack. The container
# image is built `deployed` and bakes NO site — whoever deploys it mounts
# /cfg.customer.yml (platform-api UserData for cloud/ISO, the device-demo
# launcher), and it fails closed without one. See src/resolveConfig.ts.

local:
  logLevel: DEBUG
  e2e: false
  deploymentName: "Localhost Dev"
  deploymentHost: "localhost"
  siteId: "local_site"
  mqttUri: "ws://localhost:8083/mqtt"
  deviceApiUri: "/api"
  chatApiUri: "http://localhost:8000"
  derControlUri: "/der-control"
