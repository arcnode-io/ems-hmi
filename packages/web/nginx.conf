# ARCNODE EMS HMI — reverse proxy + SPA host.
# The browser only reaches :80; everything same-origin so /api/auth/login and
# wss://host/mqtt resolve. Upstreams are compose service names.
#
# Upstreams go through a variable + the docker resolver so nginx resolves them
# at REQUEST time, not at startup. Without this, a literal `proxy_pass
# http://analyst-server:8000` makes nginx abort on boot if any upstream is
# absent ("host not found in upstream") — so an appliance without the analyst
# stack could never start the HMI at all. With it, a missing upstream just 502s
# that one route; the SPA + telemetry keep working.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Docker's embedded DNS. valid=10s re-resolves as containers come/go; ipv6=off
  # avoids AAAA lookups the compose network doesn't serve.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Per-deployment runtime overlay. Platform mounts the file; absent → 404 (the
  # HMI then falls back to its baked cfg block).
  location = /cfg.customer.yml {
    alias /opt/arcnode/hmi-cfg.customer.yml;
  }

  # device-api — strip /api/ (its routes are bare: /auth/*, /topology/*). With a
  # variable proxy_pass the trailing-slash strip no longer happens automatically,
  # so rewrite the prefix off explicitly before proxying.
  #
  # Read-only except auth: the HMI only ever GETs device-api, bar login. Its
  # unauthenticated writes (POST /topology, /example) must not be reachable
  # through the operator's front door — real guard belongs in device-api.
  location /api/auth/ {
    set $device_api "http://device-api:3000";
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $device_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /api/ {
    limit_except GET HEAD {
      deny all;
    }
    set $device_api "http://device-api:3000";
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $device_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # analyst-server — NO strip (real route is /analyst/chat; HMI posts it with an
  # empty chatApiUri). SSE: buffering off so the stream isn't held back.
  location /analyst/ {
    set $analyst "http://analyst-server:8000";
    proxy_pass $analyst;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_cache off;
  }

  # der-control-api — ONLY the events history read, exact path, GET only. Its
  # other routes trust X-SSL-Client-Cert from the mTLS ingress, so a wider
  # prefix would let anyone POST a DERControl with a forged header. The header
  # is blanked here too. Bearer-guarded upstream (device-api's token).
  location = /der-control/events {
    limit_except GET HEAD {
      deny all;
    }
    set $der_control "http://der-control-api:8080";
    rewrite ^/der-control/(.*)$ /$1 break;
    proxy_pass $der_control;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-SSL-Client-Cert "";
  }

  # HiveMQ websocket listener (:8000, path /mqtt) — browser MQTT-over-WSS.
  location /mqtt {
    set $broker "http://hivemq:8000";
    proxy_pass $broker;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400s; # keep idle MQTT sockets open
  }

  # SPA fallback — every other path serves the app shell.
  location / {
    try_files $uri /index.html;
  }
}
