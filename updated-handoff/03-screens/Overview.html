<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=1280"/>
<title>EMS HMI — Overview · Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Cormorant+Garamond:wght@400;500;600&family=Space+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #1a1a1a;
    background:
      radial-gradient(ellipse 60% 80% at 25% 50%, #0e0e0e, #050505 70%),
      radial-gradient(ellipse 60% 80% at 75% 50%, #f0eadd, #d8d0bf 70%);
    background-blend-mode: normal;
    /* split-screen backdrop */
    background:
      linear-gradient(90deg, #050505 0%, #0a0a0a 50%, #d8d0bf 50%, #c8bea8 100%);
    font-family: system-ui, -apple-system, sans-serif;
    color: #fff;
  }
  .stage {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 36px 24px 60px;
    box-sizing: border-box;
    gap: 32px;
  }
  .col { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .col-label {
    font-family: 'DM Mono', monospace;
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.18em; text-transform: uppercase;
  }
  .col-label.sov  { color: #8a8680; }
  .col-label.solr { color: #5a5248; }
  .col-meta {
    font-family: 'DM Mono', monospace;
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    margin-top: -10px;
  }
  .col-meta.sov  { color: #6b6860; }
  .col-meta.solr { color: #8a8278; }
  .header {
    position: fixed; top: 14px; left: 0; right: 0;
    text-align: center; pointer-events: none;
    font-family: 'DM Mono', monospace;
    font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
  }
  .header .t { color: #d4d0c8; mix-blend-mode: difference; }
  /* alarm pulse */
  @keyframes ackPulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.55; transform: scale(0.85); }
  }
  /* hide scrollbars in nested scrollers */
  ::-webkit-scrollbar { display: none; }
</style>

<!-- React 18 + Babel (pinned per house rules) -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="marketing-mode.js"></script>
</head>
<body>
<div class="header"><span class="t">EMS HMI · Overview · Mobile · v1</span></div>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#0a3d2e"/>
        <stop offset="1" stop-color="#27a699"/>
      </linearGradient>
    </defs>
    <rect width="100" height="100" fill="url(#g)"/>
    <g transform="translate(38 38) scale(1)"  fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 4h7v7H4zM13 4h7v4h-7zM13 10h7v10h-7zM4 13h7v7H4z"/>
    </g>
  </svg>
</template>

<div id="root"></div>

<script type="text/babel" src="tokens.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="phone-shell.jsx"></script>
<script type="text/babel" src="overview-screen.jsx"></script>

<script type="text/babel">
  function App() {
    return (
      <div className="stage">
        <div className="col" data-screen-label="Overview · Solarpunk · Mobile">
          <div className="col-label solr">Solarpunk · Light</div>
          <PhoneShell t={SOLARPUNK} bottom={<OverviewBottomTabs t={SOLARPUNK}/>}>
            <OverviewScreen t={SOLARPUNK}/>
          </PhoneShell>
          <div className="col-meta solr">380 × 820 · phone breakpoint</div>
        </div>
        <div className="col" data-screen-label="Overview · Sovereign · Mobile">
          <div className="col-label sov">Sovereign · Dark</div>
          <PhoneShell t={SOVEREIGN} bottom={<OverviewBottomTabs t={SOVEREIGN}/>}>
            <OverviewScreen t={SOVEREIGN}/>
          </PhoneShell>
          <div className="col-meta sov">380 × 820 · phone breakpoint</div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
